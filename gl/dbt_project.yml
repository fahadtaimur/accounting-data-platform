name: 'gl'
version: '1.0.0'
profile: 'gl'  # must match the top-level key in profiles.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:  # removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Default materialization setting
models:
  gl:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
